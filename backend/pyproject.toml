[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ekt-assistant-backend"
version = "0.1.0"
description = "EKT catalog, assistant domain services and session/chat HTTP API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
  "anthropic>=1.8,<2",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "psycopg-pool>=3.2,<4",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.modules.assistant" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
